# CI: unit tests, dependency audit, secret scan and a production build on
# every push/PR (R20), plus the database tests against a local Supabase.
# Actions are pinned to commit SHAs (Dependabot proposes updates).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:high
      - run: npm run scan
      # Placeholder public values: proves the build works and its output is
      # secret-free. Real values live only in the Vercel project settings.
      - run: npm run build
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
